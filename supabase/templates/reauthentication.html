<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Confirm it is you</title>
</head>
<body style="margin:0;padding:0;background:#F5F4F1;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F5F4F1;">
  <tr>
    <td align="center" style="padding:40px 20px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background:#FBFAF8;border:1px solid #DEDBD5;border-radius:8px;">
        <tr>
          <td style="padding:36px 36px 40px;">

            <div style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#3A4658;padding-bottom:26px;">Haus&nbsp;of&nbsp;Oracle</div>

            <div style="font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;font-size:34px;line-height:1.1;color:#0E1A2E;">Confirm it is you</div>

            <div style="font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;font-size:17px;line-height:1.6;color:#2B3444;padding-top:14px;">Enter this code to finish what you started.</div>



            <div style="padding-top:26px;">
              <div style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#9A978F;padding-bottom:10px;">Your code</div>
              <div style="font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;font-size:30px;letter-spacing:0.18em;color:#0E1A2E;">{{ .Token }}</div>
            </div>
            <div style="font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;font-size:15px;line-height:1.6;color:#6C6A65;padding-top:28px;">The code is good for one hour.</div>


          </td>
        </tr>
      </table>

      <div style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;line-height:1.7;color:#9A978F;padding-top:22px;max-width:520px;">
        Sent to {{ .Email }} because someone asked to sign in to Haus of Oracle.<br>
        If that was not you, ignore this — nothing happens until the link is opened.
      </div>

    </td>
  </tr>
</table>
</body>
</html>
